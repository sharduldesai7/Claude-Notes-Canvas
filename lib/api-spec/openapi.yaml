openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: thought-maps
    description: Thought Maps operations
  - name: user
    description: User settings operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /thought-maps:
    get:
      operationId: listThoughtMaps
      tags: [thought-maps]
      summary: List all thought maps for the current user
      responses:
        "200":
          description: List of thought maps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThoughtMap"
    post:
      operationId: createThoughtMap
      tags: [thought-maps]
      summary: Create a new thought map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThoughtMapBody"
      responses:
        "201":
          description: Created thought map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThoughtMap"

  /thought-maps/{id}:
    get:
      operationId: getThoughtMap
      tags: [thought-maps]
      summary: Get a thought map with all nodes and connections
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full thought map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThoughtMapFull"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateThoughtMap
      tags: [thought-maps]
      summary: Update a thought map
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThoughtMapBody"
      responses:
        "200":
          description: Updated thought map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThoughtMap"
    delete:
      operationId: deleteThoughtMap
      tags: [thought-maps]
      summary: Delete a thought map
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /thought-maps/{mapId}/nodes:
    get:
      operationId: listNodes
      tags: [thought-maps]
      summary: List all nodes in a thought map
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
    post:
      operationId: createNode
      tags: [thought-maps]
      summary: Create a node in a thought map
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeBody"
      responses:
        "201":
          description: Created node with auto-connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /thought-maps/{mapId}/nodes/{nodeId}:
    patch:
      operationId: updateNode
      tags: [thought-maps]
      summary: Update a node
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeBody"
      responses:
        "200":
          description: Updated node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    delete:
      operationId: deleteNode
      tags: [thought-maps]
      summary: Delete a node
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /thought-maps/{mapId}/connections:
    get:
      operationId: listConnections
      tags: [thought-maps]
      summary: List all connections in a thought map
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
    post:
      operationId: createConnection
      tags: [thought-maps]
      summary: Create a connection between nodes
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionBody"
      responses:
        "201":
          description: Created connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"

  /thought-maps/{mapId}/connections/{connectionId}:
    delete:
      operationId: deleteConnection
      tags: [thought-maps]
      summary: Delete a connection
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
        - name: connectionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /thought-maps/{mapId}/nodes/{nodeId}/chat:
    post:
      operationId: chatWithNode
      tags: [thought-maps]
      summary: Send a chat message to an AI chat node and stream a response (SSE)
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatBody"
      responses:
        "200":
          description: SSE stream of chat response
          content:
            text/event-stream: {}

  /thought-maps/{mapId}/nodes/{nodeId}/ask-claude:
    post:
      operationId: askClaude
      tags: [thought-maps]
      summary: Send node content to Claude and stream a response (SSE)
      parameters:
        - name: mapId
          in: path
          required: true
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskClaudeBody"
      responses:
        "200":
          description: SSE stream of Claude response
          content:
            text/event-stream: {}

  /user/settings:
    get:
      operationId: getUserSettings
      tags: [user]
      summary: Get the current user's settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      operationId: updateUserSettings
      tags: [user]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettingsBody"
      responses:
        "200":
          description: Updated user settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ThoughtMap:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - createdAt
        - updatedAt

    ThoughtMapFull:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
      required:
        - id
        - userId
        - title
        - createdAt
        - updatedAt
        - nodes
        - connections

    Node:
      type: object
      properties:
        id:
          type: integer
        mapId:
          type: integer
        title:
          type: string
          nullable: true
        nodeType:
          type: string
        content:
          type: string
        chatHistory:
          type: string
          nullable: true
        positionX:
          type: number
        positionY:
          type: number
        width:
          type: number
        height:
          type: number
        color:
          type: string
          nullable: true
        claudeResponse:
          type: string
          nullable: true
        isProcessing:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - mapId
        - nodeType
        - content
        - positionX
        - positionY
        - width
        - height
        - isProcessing
        - createdAt
        - updatedAt

    Connection:
      type: object
      properties:
        id:
          type: integer
        mapId:
          type: integer
        fromNodeId:
          type: integer
        toNodeId:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - mapId
        - fromNodeId
        - toNodeId
        - createdAt

    UserSettings:
      type: object
      properties:
        userId:
          type: string
        preferredModel:
          type: string
        customApiKey:
          type: string
          nullable: true
        customBaseUrl:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - preferredModel
        - updatedAt

    CreateThoughtMapBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    UpdateThoughtMapBody:
      type: object
      properties:
        title:
          type: string

    CreateNodeBody:
      type: object
      properties:
        title:
          type: string
          nullable: true
        nodeType:
          type: string
        content:
          type: string
        chatHistory:
          type: string
          nullable: true
        positionX:
          type: number
        positionY:
          type: number
        width:
          type: number
        height:
          type: number
        color:
          type: string
          nullable: true
      required:
        - content
        - positionX
        - positionY

    UpdateNodeBody:
      type: object
      properties:
        title:
          type: string
          nullable: true
        nodeType:
          type: string
        content:
          type: string
        chatHistory:
          type: string
          nullable: true
        positionX:
          type: number
        positionY:
          type: number
        width:
          type: number
        height:
          type: number
        color:
          type: string
          nullable: true
        claudeResponse:
          type: string
          nullable: true
        isProcessing:
          type: boolean

    ChatBody:
      type: object
      properties:
        message:
          type: string
        contextNodeIds:
          type: array
          items:
            type: integer
      required:
        - message

    CreateConnectionBody:
      type: object
      properties:
        fromNodeId:
          type: integer
        toNodeId:
          type: integer
      required:
        - fromNodeId
        - toNodeId

    AskClaudeBody:
      type: object
      properties:
        prompt:
          type: string
        contextNodeIds:
          type: array
          items:
            type: integer
      required:
        - prompt

    UpdateUserSettingsBody:
      type: object
      properties:
        preferredModel:
          type: string
        customApiKey:
          type: string
          nullable: true
        customBaseUrl:
          type: string
          nullable: true

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
