kind = "web"
previewPath = "/"
title = "Thought Maps"
version = "1.0.0"
id = "artifacts/thought-maps"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25333

[services.development]
run = "pnpm --filter @workspace/thought-maps run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thought-maps", "run", "build" ]
publicDir = "artifacts/thought-maps/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25333"
BASE_PATH = "/"
